version: '3.8'

# Shared environment variables used by both services
x-shared-env: &shared-env
  # Keycloak OIDC (REQUIRED)
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
  KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-account}
  # Git & Worktree paths
  GIT_REPOS_PATH: ${GIT_REPOS_PATH:-./git-repos}
  CATALOG_PATH: ${CATALOG_PATH:-./catalog.json}
  # Frontend lineage graph settings
  DBT_UI__FRONTEND_LINEAGE_MAX_NODES: ${DBT_UI__FRONTEND_LINEAGE_MAX_NODES:-200}
  # MetaDV feature toggle (default: true - enabled)
  DBT_UI__METADV_ENABLED: ${DBT_UI__METADV_ENABLED:-true}
  # Backend-specific
  PYTHONUNBUFFERED: 1
  # Frontend URL for CORS (default: http://localhost for Docker)
  DBT_UI__FRONTEND_URL: ${DBT_UI__FRONTEND_URL:-http://localhost}
  # Backend URL for nginx proxy (default: http://backend:8000)
  DBT_UI__BACKEND_URL: ${DBT_UI__BACKEND_URL:-http://backend:8000}

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    volumes:
      - ${DBT_UI__GIT_REPOS_PATH:-./git-repos}:/home/dbtui/git-repos
    environment:
      <<: *shared-env

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        DBT_UI__FRONTEND_LINEAGE_MAX_NODES: ${DBT_UI__FRONTEND_LINEAGE_MAX_NODES:-200}
        DBT_UI__METADV_ENABLED: ${DBT_UI__METADV_ENABLED:-true}
    environment:
      <<: *shared-env
    depends_on:
      - backend

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    command:
      - --provider=oidc
      - --oidc-issuer-url=${KEYCLOAK_ISSUER}
      - --client-id=${OAUTH2_CLIENT_ID}
      - --client-secret=${OAUTH2_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --cookie-secure=false
      - --cookie-name=dbt-ui-session
      - --upstream=http://frontend:80
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --set-authorization-header=true
      - --pass-access-token=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --skip-auth-route=/health
      - --skip-auth-route=/api/health
      - --scope=openid email profile
      - --code-challenge-method=S256
      - --redirect-url=http://192.168.1.54/oauth2/callback
    environment:
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
    ports:
      - "${DBT_UI__FRONTEND_PORT:-80}:4180"
    depends_on:
      - frontend
